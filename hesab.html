<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HESAB">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700;900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<title>HESAB</title>
<style>
/* ── RESET & ROOT ── */
:root {
  --red: #c0392b;
  --red-dark: #96281b;
  --black: #111111;
  --dark: #1a1a1a;
  --surface: #1e1e1e;
  --surface2: #272727;
  --panel: #242424;
  --border: #2e2e2e;
  --border2: #3a3a3a;
  --mid: #999;
  --text: #f0f0f0;
  --light: #e0e0e0;
  --text-muted: #777;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  background: var(--black);
  color: var(--text);
  font-family: 'Barlow', Arial, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: subpixel-antialiased;
}

/* ── HEADER ── */
#header {
  background: var(--red);
  flex-shrink: 0;
  padding: 10px 14px 0;
}
#top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
#logo-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
#logo-wrap img {
  height: 40px;
  width: auto;
}
#logo-text {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  line-height: 1.3;
}
#date-block { text-align: center; }
#date-label { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 0.04em; text-transform: uppercase; }
#date-sub { font-size: 12px; color: rgba(255,255,255,0.7); }
#week-num { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
#nav-btns { display: flex; gap: 6px; }
#nav-btns button {
  background: rgba(255,255,255,0.15);
  border: none; color: #fff;
  font-size: 22px; width: 36px; height: 36px;
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
}
#nav-btns button:active { background: rgba(255,255,255,0.3); }

/* week strip */
#week-strip { display: flex; justify-content: space-between; padding: 8px 2px 0; gap: 2px; }
.week-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 10px; cursor: pointer; border-radius: 8px 8px 0 0; }
.week-day:active { background: rgba(255,255,255,0.1); }
.wd-letter { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.05em; }
.wd-circle { width: 30px; height: 30px; }
.wd-circle svg { width: 30px; height: 30px; }

/* ── TAB BAR ── */
#tab-bar {
  display: flex;
  background: var(--dark);
  border-bottom: 2px solid var(--border2);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 10px 0 8px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color 0.15s;
}
.tab-btn.active {
  color: #fff;
  border-bottom-color: var(--red);
}

/* ── VIEWS ── */
#view-kalender, #view-tid {
  flex: 1;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
#view-kalender.active, #view-tid.active {
  display: flex;
}

/* ════════════════════════════════════
   KALENDER VIEW
════════════════════════════════════ */
#scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--black);
}
#scroll-area::-webkit-scrollbar { width: 2px; }
#scroll-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.slot { display: flex; min-height: 50px; border-bottom: 1px solid var(--border); cursor: pointer; }
.slot.hour-start { border-top: 1px solid var(--border2); }
.slot:active { background: var(--surface2); }
.slot.has-note { background: var(--surface); }
.time-col { width: 58px; flex-shrink: 0; padding: 8px 10px 0; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.slot.hour-start .time-col { color: #999; }
.note-col { flex: 1; padding: 8px 12px 8px 0; display: flex; align-items: flex-start; }
.note-indicator { width: 3px; align-self: stretch; background: var(--red); border-radius: 2px; margin-right: 10px; flex-shrink: 0; display: none; }
.has-note .note-indicator { display: block; }
.note-text { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.35; word-break: break-word; width: 100%; }

/* kalender modal */
#kal-modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 100;
}
#kal-modal-bg.open { display: flex; }
#kal-modal {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  width: 100%; max-width: 430px;
  padding: 20px 16px 32px;
  border-top: 1px solid var(--border2);
}
#kal-modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 16px; }
#kal-modal-time { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; color: var(--red); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
#kal-modal textarea {
  width: 100%; background: var(--surface2);
  border: 1px solid var(--border2); border-radius: 12px;
  color: var(--text); font-size: 16px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 400;
  padding: 12px 14px; resize: none; height: 100px; outline: none; line-height: 1.4;
}
#kal-modal textarea:focus { border-color: var(--red); }
#kal-modal-actions { display: flex; gap: 10px; margin-top: 14px; }
#kal-modal-actions button {
  height: 46px; border-radius: 12px; border: none;
  font-size: 16px; font-weight: 700;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
}
#kal-btn-save { flex: 1; background: var(--red); color: #fff; }
#kal-btn-save:active { background: var(--red-dark); }
#kal-btn-cancel { flex: 1; background: var(--border2); color: var(--text); }
#kal-btn-delete { background: transparent; color: var(--text-muted); border: 1px solid var(--border2) !important; border-radius: 12px; font-size: 14px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; padding: 0 16px; height: 46px; flex: 0 0 auto; display: none; }
#kal-btn-sms { background: #1a3a1a; color: #6fcf6f; border: 1px solid #2a5a2a; border-radius: 12px; font-size: 14px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; padding: 0 16px; height: 46px; flex: 0 0 auto; display: none; }
#kal-btn-sms:active { background: #2a5a2a; }

/* ════════════════════════════════════
   TIDSREGISTRERING VIEW
════════════════════════════════════ */
#tid-inner {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px 100px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
#tid-inner::-webkit-scrollbar { width: 2px; }
#tid-inner::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* clock */
.clock-bar { background: #111; border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; align-items: center; padding: 12px 20px; gap: 3px; }
#clock-time { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(36px,10vw,54px); font-weight: 900; letter-spacing: 4px; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
#clock-time .colon { color: var(--red); animation: blink 1s step-start infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }
#clock-date { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px; color: var(--mid); text-transform: uppercase; }

/* card */
.t-card { background: var(--panel); border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; }
.t-card-head { background: var(--dark); border-bottom: 2px solid var(--red); padding: 10px 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--mid); }
.t-card-body { padding: 16px; }

label { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--mid); margin-bottom: 8px; }
input[type="text"] { background: #111; border: 1px solid var(--border2); border-radius: 4px; color: var(--text); font-family: 'Barlow', Arial, sans-serif; font-size: 16px; padding: 14px; outline: none; transition: border-color .15s; width: 100%; margin-bottom: 14px; -webkit-appearance: none; }
input[type="text"]:focus { border-color: var(--red); }
input[type="text"]::placeholder { color: #555; }
input[type="text"].err { border-color: var(--red); animation: shake .3s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(18px,5vw,22px); font-weight: 900; letter-spacing: 3px; text-transform: uppercase; border: none; border-radius: 4px; padding: 18px 0; cursor: pointer; transition: filter .12s, transform .1s; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 60px; touch-action: manipulation; -webkit-appearance: none; }
.btn:active { transform: scale(.96); }
.btn svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
.btn-start { background: var(--red); color: #fff; }
.btn-start:hover { filter: brightness(1.18); }
.btn-stopp { background: #2a2a2a; color: var(--text); border: 1px solid var(--border2); }
.btn-stopp:hover { border-color: var(--red); color: var(--red); }

#status-bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 1.5px; color: #777; min-height: 22px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #444; flex-shrink: 0; }
.dot.on { background: #4caf50; box-shadow: 0 0 7px #4caf5099; animation: pulse 1.4s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

/* log list */
#log-list { display: flex; flex-direction: column; }
.log-row { display: grid; grid-template-columns: 32px 1fr auto; align-items: stretch; border-bottom: 1px solid var(--border); transition: background .1s; animation: si .2s ease; cursor: pointer; }
.log-row:last-child { border-bottom: none; }
.log-row:active { background: #2c2c2c; }
@keyframes si { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
.log-num { display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; color: #555; border-right: 1px solid var(--border); padding: 12px 0; }
.log-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.log-obj-name { font-size: 15px; font-weight: 600; color: var(--text); }
.log-times { display: flex; flex-direction: column; gap: 3px; }
.log-time-row { display: flex; align-items: center; gap: 7px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; flex-wrap: wrap; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 2px 6px; border-radius: 2px; min-width: 46px; text-align: center; flex-shrink: 0; }
.tag-start { background: #1e3a1e; color: #6fcf6f; }
.tag-stopp { background: #3a1e1e; color: #cf6f6f; }
.t-time { color: var(--text); letter-spacing: 1px; }
.t-date { color: #666; font-size: 12px; }
.log-dur { display: flex; align-items: center; justify-content: center; padding: 10px 12px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; color: #555; white-space: nowrap; border-left: 1px solid var(--border); min-width: 56px; }
.log-dur.has-dur { color: #d4941a; font-weight: 700; }
.open-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 2px 6px; border-radius: 2px; background: #1a2e1a; color: #5cb85c; animation: pulse 1.4s infinite; }
.empty { padding: 32px 16px; text-align: center; color: #555; font-size: 14px; letter-spacing: 1px; font-family: 'Barlow Condensed', sans-serif; }
.log-del { display: flex; align-items: center; justify-content: center; width: 32px; background: none; border: none; color: #555; cursor: pointer; font-size: 16px; flex-shrink: 0; transition: color .15s; padding: 0; align-self: stretch; }
.log-del:hover { color: #e06060; }

.toolbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--dark); flex-wrap: wrap; gap: 8px; }
.toolbar-count { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px; color: var(--mid); }
.toolbar-count b { color: var(--text); font-weight: 700; }
.btn-row-sm { display: flex; gap: 8px; }
.btn-sm { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; background: none; border: 1px solid var(--border2); color: var(--light); border-radius: 3px; padding: 8px 14px; cursor: pointer; transition: border-color .12s, color .12s; min-height: 36px; touch-action: manipulation; }
.btn-sm:hover { border-color: var(--red); color: var(--red); }
.btn-sm:active { transform: scale(.96); }
.btn-export { background: var(--red); border-color: var(--red); color: #fff; }
.btn-export:hover { filter: brightness(1.15); color: #fff; }

/* tid modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border2); border-radius: 6px; width: 100%; max-width: 420px; overflow: hidden; }
.modal-head { background: var(--dark); border-bottom: 2px solid var(--red); padding: 12px 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--mid); }
.modal-body { padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.modal-body label { margin-bottom: 4px; }
.modal-body input { margin-bottom: 0; }
.modal-row { display: flex; flex-direction: column; gap: 6px; }
.modal-foot { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--border); background: var(--dark); }
.modal-foot .btn-sm { flex: 1; text-align: center; padding: 10px 0; }
.btn-danger { background: #3a1a1a; border-color: #6a2a2a; color: #e06060; }
.btn-danger:hover { background: #5a1a1a; border-color: var(--red); color: #ff8080; }
.btn-save { background: var(--red); border-color: var(--red); color: #fff; }
.btn-save:hover { filter: brightness(1.15); color: #fff; }

/* toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(140px); background: #1e1e1e; border: 1px solid var(--red); border-radius: 6px; width: calc(100% - 32px); max-width: 420px; z-index: 200; transition: transform .4s cubic-bezier(.175,.885,.32,1.275); box-shadow: 0 4px 24px rgba(0,0,0,.7); overflow: hidden; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; animation: pulse 1.4s infinite; }
.toast-title { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 1px; color: var(--text); flex: 1; }
.toast-arrow { font-size: 12px; color: var(--mid); transition: transform .25s; }
.toast.expanded .toast-arrow { transform: rotate(180deg); }
.toast-body { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
.toast.expanded .toast-body { max-height: 200px; }
.toast-changelog { padding: 0 14px 12px; border-top: 1px solid #333; }
.toast-changelog ul { list-style: none; padding: 8px 0 10px; display: flex; flex-direction: column; gap: 5px; }
.toast-changelog li { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; color: #bbb; letter-spacing: .5px; padding-left: 14px; position: relative; }
.toast-changelog li:before { content: ">"; position: absolute; left: 0; color: var(--red); }
.toast-foot { display: flex; justify-content: flex-end; padding: 0 14px 12px; }
.toast-foot button { background: var(--red); border: none; color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 7px 16px; border-radius: 3px; cursor: pointer; }
</style>
</head>

var activeTab = 'kalender';
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var tab = this.dataset.tab;
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    document.querySelectorAll('#view-kalender,#view-tid').forEach(function(v){ v.classList.remove('active'); });
    document.getElementById('view-' + tab).classList.add('active');
    // update logo subtitle
    document.getElementById('logo-text').innerHTML = tab === 'kalender' ? 'Daglig<br>Planering' : 'Tids<br>Registrering';
    // update header nav visibility
    var showNav = tab === 'kalender';
    document.getElementById('nav-btns').style.visibility = showNav ? 'visible' : 'hidden';
    document.getElementById('week-strip').style.display = showNav ? 'flex' : 'none';
    document.getElementById('date-block').style.visibility = showNav ? 'visible' : 'hidden';
  });
});

var KAL = (function() {
  var START_H = 6, END_H = 22;
  var TOTAL_SLOTS = (END_H - START_H) * 2;
  var DAYS_SV = ['Sön','Mån','Tis','Ons','Tor','Fre','Lör'];
  var DAYS_FULL = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  var MONTHS_SV = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];

  var currentDate = new Date();
  currentDate.setHours(0,0,0,0);
  var activeSlot = null;

  function dateKey(d) { return d.toISOString().slice(0,10); }
  function loadNotes(d) { try { return JSON.parse(localStorage.getItem('hesab_dag_' + dateKey(d)) || '{}'); } catch(e) { return {}; } }
  function saveNotes(d, notes) { localStorage.setItem('hesab_dag_' + dateKey(d), JSON.stringify(notes)); }
  function slotKey(h, m) { return h + ':' + (m === 0 ? '00' : '30'); }
  function slotLabel(h, m) { return String(h).padStart(2,'0') + ':' + (m === 0 ? '00' : '30'); }

  function getWeekNumber(d) {
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
    var yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  }

  function getMondayOf(d) {
    var day = new Date(d);
    var dow = day.getDay();
    var diff = dow === 0 ? -6 : 1 - dow;
    day.setDate(day.getDate() + diff);
    return day;
  }

  function bookingFraction(d) {
    var notes = loadNotes(d);
    var count = Object.values(notes).filter(function(v){ return v && v.trim(); }).length;
    return Math.min(count / TOTAL_SLOTS, 1);
  }

  function makePieCircle(fraction, isSelected, isToday, dateNum) {
    var r = 13, cx = 15, cy = 15;
    var full = fraction >= 1, empty = fraction <= 0;
    var numColor = full ? '#c0392b' : 'white';
    var baseCircle;
    if (isSelected) {
      baseCircle = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="2"/>';
    } else if (isToday) {
      baseCircle = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>';
    } else {
      baseCircle = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>';
    }
    var fillPath = '';
    if (full) {
      fillPath = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="white"/>';
    } else if (!empty) {
      var angle = fraction * 2 * Math.PI;
      var x = cx + r * Math.sin(angle);
      var y = cy - r * Math.cos(angle);
      var large = fraction > 0.5 ? 1 : 0;
      fillPath = '<path d="M'+cx+','+cy+' L'+cx+','+(cy-r)+' A'+r+','+r+' 0 '+large+',1 '+x.toFixed(2)+','+y.toFixed(2)+' Z" fill="white"/>';
    }
    var selectedRing = (isSelected && full) ? '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="white" stroke-width="2.5"/>' : '';
    return '<svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">'+baseCircle+fillPath+selectedRing
      +'<text x="'+cx+'" y="'+(cy+1)+'" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="500" fill="'+numColor+'" font-family="sans-serif">'+dateNum+'</text></svg>';
  }

  function renderWeekStrip() {
    var strip = document.getElementById('week-strip');
    strip.innerHTML = '';
    var monday = getMondayOf(currentDate);
    var today = new Date(); today.setHours(0,0,0,0);
    for (var i = 0; i < 7; i++) {
      var day = new Date(monday);
      day.setDate(monday.getDate() + i);
      var isSelected = dateKey(day) === dateKey(currentDate);
      var isToday = dateKey(day) === dateKey(today);
      var fraction = bookingFraction(day);
      var el = document.createElement('div');
      el.className = 'week-day';
      var letter = document.createElement('div');
      letter.className = 'wd-letter';
      letter.textContent = DAYS_SV[day.getDay()];
      var circleDiv = document.createElement('div');
      circleDiv.className = 'wd-circle';
      circleDiv.innerHTML = makePieCircle(fraction, isSelected, isToday, day.getDate());
      el.appendChild(letter);
      el.appendChild(circleDiv);
      (function(dayCopy){ el.addEventListener('click', function(){ currentDate = new Date(dayCopy); renderAll(); }); })(new Date(day));
      strip.appendChild(el);
    }
  }

  function renderHeader() {
    document.getElementById('date-label').textContent = DAYS_FULL[currentDate.getDay()].toUpperCase();
    document.getElementById('date-sub').textContent = currentDate.getDate() + ' ' + MONTHS_SV[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
    document.getElementById('week-num').textContent = 'V.' + getWeekNumber(currentDate);
  }

  function renderSlots() {
    var area = document.getElementById('scroll-area');
    area.innerHTML = '';
    var notes = loadNotes(currentDate);
    var now = new Date();
    var scrollTarget = null;
    for (var h = START_H; h < END_H; h++) {
      for (var m = 0; m < 60; m += 30) {
        var key = slotKey(h, m);
        var note = notes[key] || '';
        var div = document.createElement('div');
        div.className = 'slot' + (m === 0 ? ' hour-start' : '') + (note ? ' has-note' : '');
        var timeDiv = document.createElement('div');
        timeDiv.className = 'time-col';
        timeDiv.textContent = m === 0 ? slotLabel(h, m) : '';
        var indicator = document.createElement('div');
        indicator.className = 'note-indicator';
        var noteDiv = document.createElement('div');
        noteDiv.className = 'note-col';
        noteDiv.appendChild(indicator);
        if (note) {
          var noteSpan = document.createElement('div');
          noteSpan.className = 'note-text';
          noteSpan.textContent = note;
          noteDiv.appendChild(noteSpan);
        }
        div.appendChild(timeDiv);
        div.appendChild(noteDiv);
        (function(hh, mm, nn){ div.addEventListener('click', function(){ openModal(hh, mm, nn); }); })(h, m, note);
        area.appendChild(div);
        var isToday = dateKey(currentDate) === dateKey(now);
        if (isToday && h === now.getHours() && (m === 0 ? now.getMinutes() < 30 : now.getMinutes() >= 30)) {
          scrollTarget = div;
        }
      }
    }
    if (scrollTarget) { setTimeout(function(){ scrollTarget.scrollIntoView({ block: 'center' }); }, 50); }
  }

  function renderAll() { renderHeader(); renderWeekStrip(); renderSlots(); }

  function openModal(h, m, note) {
    activeSlot = { h: h, m: m };
    var endH = m === 30 ? h + 1 : h, endM = m === 30 ? 0 : 30;
    document.getElementById('kal-modal-time').textContent = slotLabel(h, m) + ' – ' + slotLabel(endH, endM);
    document.getElementById('kal-modal-input').value = note;
    document.getElementById('kal-btn-delete').style.display = note ? 'block' : 'none';
    document.getElementById('kal-btn-sms').style.display = note ? 'block' : 'none';
    document.getElementById('kal-modal-bg').classList.add('open');
    setTimeout(function(){ document.getElementById('kal-modal-input').focus(); }, 150);
  }

  function closeModal() {
    document.getElementById('kal-modal-bg').classList.remove('open');
    activeSlot = null;
  }

  document.getElementById('kal-btn-save').addEventListener('click', function() {
    if (!activeSlot) return;
    var val = document.getElementById('kal-modal-input').value.trim();
    var notes = loadNotes(currentDate);
    if (val) notes[slotKey(activeSlot.h, activeSlot.m)] = val;
    else delete notes[slotKey(activeSlot.h, activeSlot.m)];
    saveNotes(currentDate, notes);
    closeModal(); renderAll();
  });
  document.getElementById('kal-btn-delete').addEventListener('click', function() {
    if (!activeSlot) return;
    var notes = loadNotes(currentDate);
    delete notes[slotKey(activeSlot.h, activeSlot.m)];
    saveNotes(currentDate, notes);
    closeModal(); renderAll();
  });
  document.getElementById('kal-btn-sms').addEventListener('click', function() {
    if (!activeSlot) return;
    var note = document.getElementById('kal-modal-input').value.trim();
    if (!note) return;
    var DAYS_FULL_SMS = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
    var MONTHS_SMS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
    var d = currentDate;
    var dayName = DAYS_FULL_SMS[d.getDay()];
    var dateStr = d.getDate() + ' ' + MONTHS_SMS[d.getMonth()];
    var timeStr = slotLabel(activeSlot.h, activeSlot.m);
    var endH = activeSlot.m === 30 ? activeSlot.h + 1 : activeSlot.h;
    var endM = activeSlot.m === 30 ? 0 : 30;
    var timeEnd = slotLabel(endH, endM);
    var msg = 'Hej! Bekräftar din tid hos HESAB:
' + dayName + ' ' + dateStr + ' kl ' + timeStr + '–' + timeEnd + '
' + note + '
Välkommen!';
    window.location.href = 'sms:?body=' + encodeURIComponent(msg);
  });
  document.getElementById('kal-btn-cancel').addEventListener('click', closeModal);
  document.getElementById('kal-modal-bg').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
  document.getElementById('prev').addEventListener('click', function(){ currentDate.setDate(currentDate.getDate() - 7); renderAll(); });
  document.getElementById('next').addEventListener('click', function(){ currentDate.setDate(currentDate.getDate() + 7); renderAll(); });

  renderAll();
  return { renderAll: renderAll };
})();

// ════════════════════════════════════
// TIDSREGISTRERING
// ════════════════════════════════════
var VERSION = '2.0';
var WHATS_NEW = ['Kalender och tidsregistrering i en app','Dagplanering med 30-min tidsluckor','Veckovy med bokningsstatus','All data sparas lokalt på enheten'];

var S = [];
var editIdx = null;
try { S = JSON.parse(localStorage.getItem('hesab_v2') || '[]'); } catch(e) {}
function save() { try { localStorage.setItem('hesab_v2', JSON.stringify(S)); } catch(e) {} }

function updateClock() {
  var d = new Date();
  var p = function(n){ return String(n).padStart(2,'0'); };
  var el = document.getElementById('clock-time');
  if (el) el.innerHTML = p(d.getHours()) + '<span class="colon">:</span>' + p(d.getMinutes()) + '<span class="colon">:</span>' + p(d.getSeconds());
  var days = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  var months = ['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
  var ed = document.getElementById('clock-date');
  if (ed) ed.textContent = days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}
updateClock();
setInterval(updateClock, 1000);

function nowP() {
  var d = new Date();
  var p = function(n){ return String(n).padStart(2,'0'); };
  return { time: p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()), date: d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()) };
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function calcDur(a, b) {
  try {
    var s = new Date(a.date+'T'+a.time), e = new Date(b.date+'T'+b.time);
    var diff = Math.round((e-s)/1000);
    if (diff < 0) return '';
    var h = Math.floor(diff/3600), m = Math.floor((diff%3600)/60), sec = diff%60;
    if (h > 0) return h+'h '+String(m).padStart(2,'0')+'m';
    if (m > 0) return m+'m '+String(sec).padStart(2,'0')+'s';
    return sec+'s';
  } catch(e) { return ''; }
}
function totalTime() {
  var total = 0;
  for (var i = 0; i < S.length; i++) {
    if (S[i].start && S[i].stopp) {
      try {
        var a = new Date(S[i].start.date+'T'+S[i].start.time);
        var b = new Date(S[i].stopp.date+'T'+S[i].stopp.time);
        var diff = Math.round((b-a)/1000);
        if (diff > 0) total += diff;
      } catch(e) {}
    }
  }
  if (total === 0) return '0m';
  var h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  if (h > 0) return h+'h '+String(m).padStart(2,'0')+'m';
  if (m > 0) return m+'m '+String(s).padStart(2,'0')+'s';
  return s+'s';
}
function parseTime(v) {
  v = v.trim().replace(/[^0-9:]/g,'');
  if (!v) return '';
  if (v.indexOf(':') !== -1) { var parts = v.split(':'); return parts[0].padStart(2,'0')+':'+(parts[1]||'00').padStart(2,'0')+':'+(parts[2]||'00').padStart(2,'0'); }
  if (v.length <= 2) return v.padStart(2,'0')+':00:00';
  if (v.length <= 4) return v.slice(0,2)+':'+v.slice(2).padEnd(2,'0')+':00';
  return v.slice(0,2)+':'+v.slice(2,4)+':'+v.slice(4,6).padEnd(2,'0');
}
function parseDate(v) {
  v = v.trim().replace(/[^0-9-]/g,'');
  if (!v) return '';
  var yyyy = String(new Date().getFullYear());
  if (v.indexOf('-') !== -1) { var p = v.split('-'); if (p[0].length === 4) return v; if (p.length === 3 && p[2].length === 4) return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0'); return v; }
  if (v.length === 4) return yyyy+'-'+v.slice(2,4).padStart(2,'0')+'-'+v.slice(0,2).padStart(2,'0');
  if (v.length === 8) return v.slice(4,8)+'-'+v.slice(2,4).padStart(2,'0')+'-'+v.slice(0,2).padStart(2,'0');
  return v;
}
function stamp(type) {
  var inp = document.getElementById('oi');
  var obj = inp.value.trim();
  if (!obj) { inp.classList.add('err'); inp.focus(); setTimeout(function(){ inp.classList.remove('err'); }, 600); return; }
  var t = nowP();
  if (type === 'START') { S.unshift({ obj: obj, start: t, stopp: null }); }
  else { var found = false; for (var i = 0; i < S.length; i++) { if (S[i].obj === obj && S[i].start && !S[i].stopp) { S[i].stopp = t; found = true; break; } } if (!found) { S.unshift({ obj: obj, start: null, stopp: t }); } }
  save(); updateStatus(); render();
}
function updateStatus() {
  var open = S.filter(function(s){ return s.start && !s.stopp; });
  var sd = document.getElementById('sd'), st = document.getElementById('st');
  if (open.length) { sd.className = 'dot on'; st.textContent = open.length + ' aktiv' + (open.length > 1 ? 'a' : '') + ': ' + open.map(function(s){ return s.obj; }).join(', '); }
  else { sd.className = 'dot'; st.textContent = 'Ingen aktiv session'; }
}
function makeTimeRow(label, cls, ts) {
  return '<div class="log-time-row"><span class="tag '+cls+'">'+label+'</span><span class="t-time">'+ts.time+'</span><span class="t-date">'+ts.date+'</span></div>';
}
function render() {
  var list = document.getElementById('ll');
  document.getElementById('ec').textContent = S.length;
  document.getElementById('tc').textContent = totalTime();
  if (!S.length) { list.innerHTML = '<div class="empty">Inga registreringar ännu</div>'; return; }
  var html = '';
  for (var i = 0; i < S.length; i++) {
    var s = S[i], num = S.length - i, d = (s.start && s.stopp) ? calcDur(s.start, s.stopp) : '';
    var times = '<div class="log-times">';
    if (s.start) times += makeTimeRow('START','tag-start',s.start);
    if (s.stopp) times += makeTimeRow('STOPP','tag-stopp',s.stopp);
    if (s.start && !s.stopp) times += '<span class="open-badge">PÅGÅR</span>';
    times += '</div>';
    html += '<div class="log-row" onclick="openEdit('+i+')"><div class="log-num">'+num+'</div><div class="log-body"><div class="log-obj-name">'+esc(s.obj)+'</div>'+times+'</div><div class="'+(d?'log-dur has-dur':'log-dur')+'">'+(d||'—')+'</div><button class="log-del" onclick="deleteEntry(event,'+i+')">&#10005;</button></div>';
  }
  list.innerHTML = html;
}
function openEdit(idx) {
  editIdx = idx;
  var s = S[idx];
  document.getElementById('m-obj').value = s.obj||'';
  document.getElementById('m-start-time').value = s.start ? s.start.time : '';
  document.getElementById('m-start-date').value = s.start ? s.start.date : '';
  document.getElementById('m-stopp-time').value = s.stopp ? s.stopp.time : '';
  document.getElementById('m-stopp-date').value = s.stopp ? s.stopp.date : '';
  document.getElementById('tid-modal').classList.add('open');
}
function closeTidModal() { document.getElementById('tid-modal').classList.remove('open'); editIdx = null; }
function saveEdit() {
  if (editIdx === null) return;
  var obj = document.getElementById('m-obj').value.trim();
  var startTime = parseTime(document.getElementById('m-start-time').value);
  var startDate = parseDate(document.getElementById('m-start-date').value);
  var stoppTime = parseTime(document.getElementById('m-stopp-time').value);
  var stoppDate = parseDate(document.getElementById('m-stopp-date').value);
  if (!obj) { document.getElementById('m-obj').classList.add('err'); setTimeout(function(){ document.getElementById('m-obj').classList.remove('err'); }, 600); return; }
  S[editIdx].obj = obj;
  S[editIdx].start = (startTime && startDate) ? { time: startTime, date: startDate } : null;
  S[editIdx].stopp = (stoppTime && stoppDate) ? { time: stoppTime, date: stoppDate } : null;
  save(); updateStatus(); render(); closeTidModal();
}
function deleteEntry(e, idx) {
  e.stopPropagation();
  if (!confirm('Radera denna post?')) return;
  S.splice(idx, 1); save(); updateStatus(); render();
}
function clearLog() {
  if (!S.length || !confirm('Rensa alla registreringar?')) return;
  S = []; save(); updateStatus(); render();
}
function exportPDF() {
  if (!S.length) return;
  var rev = S.slice().reverse(), rows = '';
  for (var i = 0; i < rev.length; i++) {
    var s = rev[i], d = (s.start && s.stopp) ? calcDur(s.start, s.stopp) : '—';
    rows += '<tr><td>'+(i+1)+'</td><td>'+esc(s.obj)+'</td><td>'+(s.start?s.start.time+' '+s.start.date:'—')+'</td><td>'+(s.stopp?s.stopp.time+' '+s.stopp.date:'Pågår')+'</td><td class="dur">'+d+'</td></tr>';
  }
  var htm = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>HESAB</title><style>body{font-family:Arial,sans-serif;font-size:12px;margin:30px;color:#111}h1{font-size:22px;margin-bottom:6px}p{color:#666;font-size:11px;margin-bottom:20px}table{width:100%;border-collapse:collapse}th{background:#c0392b;color:#fff;padding:9px 12px;text-align:left;font-size:11px;text-transform:uppercase}td{padding:8px 12px;border-bottom:1px solid #e0e0e0}tr:nth-child(even) td{background:#f7f7f7}.dur{color:#b07800;font-weight:bold}</style></head><body><h1>HESAB — Tidsregistrering</h1><p>Exporterad: '+new Date().toLocaleString('sv-SE')+' | '+S.length+' objekt | Total tid: '+totalTime()+'</p><table><thead><tr><th>#</th><th>Objekt</th><th>Start</th><th>Stopp</th><th>Tid</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>';
  var w = window.open('','_blank');
  if (w) { w.document.write(htm); w.document.close(); w.print(); }
}

document.getElementById('tid-modal').addEventListener('click', function(e){ if (e.target === this) closeTidModal(); });
document.getElementById('btn-start').addEventListener('click', function(){ stamp('START'); });
document.getElementById('btn-stopp').addEventListener('click', function(){ stamp('STOPP'); });
document.getElementById('btn-clear').addEventListener('click', clearLog);
document.getElementById('btn-export').addEventListener('click', exportPDF);
document.getElementById('m-save').addEventListener('click', saveEdit);
document.getElementById('m-cancel').addEventListener('click', closeTidModal);
document.getElementById('m-delete').addEventListener('click', function(){
  if (editIdx === null) return;
  if (!confirm('Radera denna post?')) return;
  S.splice(editIdx, 1); save(); updateStatus(); render(); closeTidModal();
});
document.getElementById('oi').addEventListener('keydown', function(e){ if (e.key === 'Enter') stamp('START'); });

render();
updateStatus();

// ── Toast ──
function showToast() {
  var toast = document.getElementById('update-toast');
  var ver = document.getElementById('toast-ver');
  var list = document.getElementById('toast-changes');
  if (!toast) return;
  if (ver) ver.textContent = 'v' + VERSION;
  if (list) list.innerHTML = WHATS_NEW.map(function(n){ return '<li>'+n+'</li>'; }).join('');
  setTimeout(function(){ toast.classList.add('show'); }, 500);
}
function toggleToast() { document.getElementById('update-toast').classList.toggle('expanded'); }
function reloadApp() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(function(reg){
      if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    });
  }
  window.location.reload();
}

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.update();
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      nw.addEventListener('statechange', function(){
        if (nw.state === 'installed' && navigator.serviceWorker.controller) showToast();
      });
    });
  }).catch(function(){});
}
</script>
